<!DOCTYPE html>
<html>
<head>
  <title>RSI Dashboard</title>
  <style>
    body { font-family: Arial; background:#111; color:#eee; }
    table { width:100%; border-collapse: collapse; margin-bottom:20px; }
    th, td { border:1px solid #444; padding:8px; text-align:center; }
    #notifications { background:#222; padding:10px; min-height:100px; }
    .buy { color:lime; }
    .sell { color:red; }
  </style>
</head>
<body>
  <h2>RSI Dashboard</h2>

  <!-- RSI Option -->
  <label for="rsiLength">RSI Length:</label>
  <select id="rsiLength">
    <option value="14" selected>14</option>
    <option value="24">24</option>
  </select>

  <table>
    <tr><th>Symbol</th><th>Price</th><th>RSI</th><th>Signal</th></tr>
    <tbody id="rows"></tbody>
  </table>

  <h3>Notifications</h3>
  <div id="notifications"></div>

<script>
// Symbol list
let symbols = [
  "BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT",
  "ADAUSDT","SOLUSDT","DOGEUSDT","DOTUSDT",
  "MATICUSDT","LTCUSDT","TRXUSDT","SHIBUSDT",
  "AVAXUSDT","ATOMUSDT","NEARUSDT","FILUSDT"
];

// Fetch data for all symbols
async function fetchData() {
  let rsiLength = parseInt(document.getElementById("rsiLength").value);
  let rowsHTML = "";

  for (let symbol of symbols) {
    let priceData = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
    let priceJson = await priceData.json();
    let price = parseFloat(priceJson.price);

    // Dummy RSI calculation (replace with TradingView logic if needed)
    let rsi = Math.floor(Math.random()*100);

    // Condition check
    let signal = "";
    if(rsi > 70) signal = "Sell";
    else if(rsi < 30) signal = "Buy";

    // Build row
    rowsHTML += `<tr>
      <td>${symbol}</td>
      <td>${price}</td>
      <td>${rsi} (RSI${rsiLength})</td>
      <td class="${signal.toLowerCase()}">${signal}</td>
    </tr>`;

    // Notification backlog
    if(signal) {
      let time = new Date().toLocaleTimeString();
      let note = `${time} - ${symbol} - ${signal} (RSI${rsiLength}:${rsi})`;
      addNotification(note);
    }
  }

  document.getElementById("rows").innerHTML = rowsHTML;
}

// Notification section with localStorage
function addNotification(note) {
  let notes = JSON.parse(localStorage.getItem("notes")||"[]");
  notes.push(note);
  localStorage.setItem("notes", JSON.stringify(notes));
  renderNotifications();
}

function renderNotifications() {
  let notes = JSON.parse(localStorage.getItem("notes")||"[]");
  document.getElementById("notifications").innerHTML = notes.map(n=>"<p>"+n+"</p>").join("");
}

// Run
renderNotifications();
setInterval(fetchData, 5000); // refresh every 5s
</script>
</body>
</html>
