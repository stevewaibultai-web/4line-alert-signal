<!DOCTYPE html>
<html>
<head>
  <title>Cross Dashboard</title>
  <style>
    body { font-family: Arial; background:#111; color:#eee; }
    table { width:100%; border-collapse: collapse; margin-bottom:20px; }
    th, td { border:1px solid #444; padding:8px; text-align:center; }
    #notifications { background:#222; padding:10px; min-height:100px; }
    .buy { color:lime; }
    .sell { color:red; }
    textarea { width:100%; height:80px; background:#222; color:#eee; }
    button { margin-top:10px; }
  </style>
</head>
<body>
  <h2>Cross Dashboard</h2>

  <!-- Symbol Editor -->
  <h3>Edit Symbols</h3>
  <textarea id="symbolsEditor"></textarea>
  <button onclick="saveSymbols()">Save Symbols</button>

  <table>
    <tr><th>Symbol</th><th>Price</th><th>Signal</th></tr>
    <tbody id="rows"></tbody>
  </table>

  <h3>Notifications</h3>
  <div id="notifications"></div>
  <button onclick="clearNotifications()">Clear Notifications</button>

<script>
// Load settings from localStorage
let symbols = JSON.parse(localStorage.getItem("symbols")) || [
  "BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT",
  "ADAUSDT","SOLUSDT","DOGEUSDT","DOTUSDT",
  "MATICUSDT","LTCUSDT","TRXUSDT","SHIBUSDT",
  "AVAXUSDT","ATOMUSDT","NEARUSDT","FILUSDT"
];
document.getElementById("symbolsEditor").value = symbols.join(",");

function saveSymbols() {
  symbols = document.getElementById("symbolsEditor").value.split(",").map(s=>s.trim()).filter(s=>s);
  localStorage.setItem("symbols", JSON.stringify(symbols));
}

// State tracking for each symbol
let states = {}; // {symbol: "above"/"below"}

// Simple SMA function
function sma(values, len) {
  return values.slice(-len).reduce((a,b)=>a+b,0)/len;
}

// Dummy price history generator (replace with real candles if needed)
function generateHistory(price) {
  let arr = [];
  for(let i=0;i<200;i++) arr.push(price + (Math.random()-0.5));
  return arr;
}

// Cross check logic (30s vs 180s)
function checkCross(symbol, priceHistory) {
  let ma30 = sma(priceHistory, 30);
  let ma180 = sma(priceHistory, 180);

  let prev = states[symbol] || "";
  let signal = "";

  if(ma30 > ma180 && prev !== "above") {
    signal = "Buy";
    states[symbol] = "above";
  }
  if(ma30 < ma180 && prev !== "below") {
    signal = "Sell";
    states[symbol] = "below";
  }
  return signal;
}

// Telegram notification
async function sendTelegram(message) {
  let token = "<YOUR_BOT_TOKEN>";
  let chatId = "<YOUR_CHAT_ID>";
  let url = `https://api.telegram.org/bot${token}/sendMessage`;
  await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({chat_id: chatId, text: message})
  });
}

// Fetch data for all symbols
async function fetchData() {
  let rowsHTML = "";

  for (let symbol of symbols) {
    let priceData = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
    let priceJson = await priceData.json();
    let price = parseFloat(priceJson.price);

    let history = generateHistory(price);
    let signal = checkCross(symbol, history);

    rowsHTML += `<tr>
      <td>${symbol}</td>
      <td>${price}</td>
      <td class="${signal.toLowerCase()}">${signal}</td>
    </tr>`;

    if(signal && !document.hasFocus()) {
      let time = new Date().toLocaleTimeString();
      let note = `${time} - ${symbol} - ${signal}`;
      addNotification(note);
      sendTelegram(note);
    }
  }

  document.getElementById("rows").innerHTML = rowsHTML;
}

function addNotification(note) {
  let notes = JSON.parse(localStorage.getItem("notes")||"[]");
  notes.push(note);
  localStorage.setItem("notes", JSON.stringify(notes));
  renderNotifications();
}

function renderNotifications() {
  let notes = JSON.parse(localStorage.getItem("notes")||"[]");
  document.getElementById("notifications").innerHTML = notes.map(n=>"<p>"+n+"</p>").join("");
}

function clearNotifications() {
  localStorage.removeItem("notes");
  renderNotifications();
}

renderNotifications();
setInterval(fetchData, 5000);
</script>
</body>
</html>
