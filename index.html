<!DOCTYPE html>
<html>
<head>
  <title>RSI Dashboard</title>
  <style>
    body { font-family: Arial; background:#111; color:#eee; }
    table { width:100%; border-collapse: collapse; margin-bottom:20px; }
    th, td { border:1px solid #444; padding:8px; text-align:center; }
    #notifications { background:#222; padding:10px; min-height:100px; }
    .buy { color:lime; }
    .sell { color:red; }
    textarea { width:100%; height:80px; background:#222; color:#eee; }
    button { margin-top:10px; }
  </style>
</head>
<body>
  <h2>RSI Dashboard</h2>

  <!-- RSI Option -->
  <label for="rsiLength">RSI Length:</label>
  <select id="rsiLength" onchange="saveSettings()">
    <option value="14">14</option>
    <option value="24">24</option>
  </select>

  <!-- Timeframe Option -->
  <label for="timeframe">Timeframe:</label>
  <select id="timeframe" onchange="saveSettings()">
    <option value="1m">1m</option>
    <option value="3m">3m</option>
    <option value="5m">5m</option>
  </select>

  <!-- Symbol Editor -->
  <h3>Edit Symbols</h3>
  <textarea id="symbolsEditor"></textarea>
  <button onclick="saveSymbols()">Save Symbols</button>

  <table>
    <tr><th>Symbol</th><th>Price</th><th>RSI</th><th>Signal</th></tr>
    <tbody id="rows"></tbody>
  </table>

  <h3>Notifications</h3>
  <div id="notifications"></div>
  <button onclick="clearNotifications()">Clear Notifications</button>

<script>
// Load settings from localStorage
let symbols = JSON.parse(localStorage.getItem("symbols")) || [
  "BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT",
  "ADAUSDT","SOLUSDT","DOGEUSDT","DOTUSDT",
  "MATICUSDT","LTCUSDT","TRXUSDT","SHIBUSDT",
  "AVAXUSDT","ATOMUSDT","NEARUSDT","FILUSDT"
];
document.getElementById("symbolsEditor").value = symbols.join(",");

let savedRSI = localStorage.getItem("rsiLength") || "14";
let savedTF  = localStorage.getItem("timeframe") || "1m";
document.getElementById("rsiLength").value = savedRSI;
document.getElementById("timeframe").value = savedTF;

function saveSettings() {
  localStorage.setItem("rsiLength", document.getElementById("rsiLength").value);
  localStorage.setItem("timeframe", document.getElementById("timeframe").value);
}

function saveSymbols() {
  symbols = document.getElementById("symbolsEditor").value.split(",").map(s=>s.trim()).filter(s=>s);
  localStorage.setItem("symbols", JSON.stringify(symbols));
}

// State tracking for each symbol
let states = {}; // {symbol: laststate}

// RSI calculation (simple version, replace with full candle-based RSI if needed)
function calcRSI(values, length) {
  let gains = 0, losses = 0;
  for(let i=1;i<values.length;i++){
    let diff = values[i]-values[i-1];
    if(diff>=0) gains+=diff; else losses-=diff;
  }
  let rs = gains/Math.max(losses,1);
  return 100-(100/(1+rs));
}

// Fetch data for all symbols
async function fetchData() {
  let rsiLength = parseInt(document.getElementById("rsiLength").value);
  let timeframe = document.getElementById("timeframe").value;
  let rowsHTML = "";

  for (let symbol of symbols) {
    let priceData = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
    let priceJson = await priceData.json();
    let price = parseFloat(priceJson.price);

    // Dummy RSI (replace with candle fetch + calcRSI)
    let rsi = Math.floor(Math.random()*100);

    let isOverbought = rsi >= 70;
    let isOversold   = rsi <= 30;

    let signal = "";
    let laststate = states[symbol] || 0;

    if(laststate === 2 && isOverbought) signal = "Sell";
    if(laststate === 1 && isOversold)   signal = "Buy";

    if(isOverbought) laststate = 1;
    if(isOversold)   laststate = 2;
    states[symbol] = laststate;

    rowsHTML += `<tr>
      <td>${symbol}</td>
      <td>${price}</td>
      <td>${rsi} (RSI${rsiLength}, TF:${timeframe})</td>
      <td class="${signal.toLowerCase()}">${signal}</td>
    </tr>`;

    if(signal && !document.hasFocus()) {
      let time = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: true });
      let note = `${time} - ${symbol} - ${signal} (RSI${rsiLength}:${rsi}, TF:${timeframe})`;
      addNotification(note);
    }
  }

  document.getElementById("rows").innerHTML = rowsHTML;
}

function addNotification(note) {
  let notes = JSON.parse(localStorage.getItem("notes")||"[]");
  notes.push(note);
  localStorage.setItem("notes", JSON.stringify(notes));
  renderNotifications();
}

function renderNotifications() {
  let notes = JSON.parse(localStorage.getItem("notes")||"[]");
  document.getElementById("notifications").innerHTML = notes.map(n=>"<p>"+n+"</p>").join("");
}

function clearNotifications() {
  localStorage.removeItem("notes");
  renderNotifications();
}

renderNotifications();
setInterval(fetchData, 5000);
</script>
</body>
</html>
