<!DOCTYPE html>
<html>
<head>
  <title>Cross Dashboard</title>
  <style>
    body { font-family: Arial; background:#111; color:#eee; }
    table { width:100%; border-collapse: collapse; margin-bottom:20px; }
    th, td { border:1px solid #444; padding:8px; text-align:center; }
    #notifications { background:#222; padding:10px; min-height:100px; }
    .buy { color:lime; }
    .sell { color:red; }
    textarea { width:100%; height:80px; background:#222; color:#eee; }
  </style>
</head>
<body>
  <h2>Cross Dashboard</h2>

  <!-- Timeframe Option for Dashboard 1 -->
  <label for="timeframe1">Timeframe (Dashboard 1):</label>
  <select id="timeframe1" onchange="saveSettings()">
    <option value="1s">1s</option>
    <option value="5s">5s</option>
    <option value="30s">30s</option>
    <option value="60s">60s</option>
    <option value="180s">180s</option>
    <option value="900s">900s</option>
  </select>

  <!-- Timeframe Option for Dashboard 2 -->
  <label for="timeframe2">Timeframe (Dashboard 2):</label>
  <select id="timeframe2" onchange="saveSettings()">
    <option value="1s">1s</option>
    <option value="5s">5s</option>
    <option value="30s">30s</option>
    <option value="60s">60s</option>
    <option value="180s">180s</option>
    <option value="900s">900s</option>
  </select>

  <!-- Symbol Editor for Dashboard 1 -->
  <h3>Edit Symbols (Dashboard 1)</h3>
  <textarea id="symbolsEditor1"></textarea>

  <!-- Symbol Editor for Dashboard 2 -->
  <h3>Edit Symbols (Dashboard 2)</h3>
  <textarea id="symbolsEditor2"></textarea>

  <!-- First Dashboard -->
  <h3>Dashboard 1</h3>
  <table>
    <tr><th>Symbol</th><th>Price</th><th>Signal</th><th>Time</th></tr>
    <tbody id="rows1"></tbody>
  </table>

  <!-- Second Dashboard -->
  <h3>Dashboard 2</h3>
  <table>
    <tr><th>Symbol</th><th>Price</th><th>Signal</th><th>Time</th></tr>
    <tbody id="rows2"></tbody>
  </table>

  <!-- Notifications -->
  <h3>Notifications</h3>
  <table>
    <tr><th>Time</th><th>Symbol</th><th>Signal</th></tr>
    <tbody id="notifications"></tbody>
  </table>
  <button onclick="clearNotifications()">Clear Notifications</button>

<script>
// Load settings
let symbols1 = JSON.parse(localStorage.getItem("symbols1")) || ["BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT"];
let symbols2 = JSON.parse(localStorage.getItem("symbols2")) || ["ADAUSDT","SOLUSDT","DOGEUSDT","DOTUSDT"];
document.getElementById("symbolsEditor1").value = symbols1.join(",");
document.getElementById("symbolsEditor2").value = symbols2.join(",");

let savedTF1 = localStorage.getItem("timeframe1") || "1s";
let savedTF2 = localStorage.getItem("timeframe2") || "5s";
document.getElementById("timeframe1").value = savedTF1;
document.getElementById("timeframe2").value = savedTF2;

function saveSettings() {
  localStorage.setItem("timeframe1", document.getElementById("timeframe1").value);
  localStorage.setItem("timeframe2", document.getElementById("timeframe2").value);
}

// Auto-save symbols when edited
document.getElementById("symbolsEditor1").addEventListener("input", ()=>{
  symbols1 = document.getElementById("symbolsEditor1").value.split(",").map(s=>s.trim()).filter(s=>s);
  localStorage.setItem("symbols1", JSON.stringify(symbols1));
});
document.getElementById("symbolsEditor2").addEventListener("input", ()=>{
  symbols2 = document.getElementById("symbolsEditor2").value.split(",").map(s=>s.trim()).filter(s=>s);
  localStorage.setItem("symbols2", JSON.stringify(symbols2));
});

// State tracking
let states1 = {}; let times1 = {};
let states2 = {}; let times2 = {};

function sma(values, len) {
  return values.slice(-len).reduce((a,b)=>a+b,0)/len;
}

// === Cross Logic (30s vs 60s) ===
function checkCross(symbol, closes, states, times) {
  let ma30  = sma(closes, 30);
  let ma60  = sma(closes, 60);

  let prev = states[symbol] || "";
  let signal = prev;

  if(ma30 > ma60 && prev !== "Buy") {
    signal = "Buy";
    states[symbol] = "Buy";
    times[symbol] = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'numeric',second:'numeric',hour12:true});
  }
  else if(ma30 < ma60 && prev !== "Sell") {
    signal = "Sell";
    states[symbol] = "Sell";
    times[symbol] = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'numeric',second:'numeric',hour12:true});
  }
  return signal;
}

    let priceJson = await priceData.json();
    let price = parseFloat(priceJson.price);

    let klines1 = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf1}&limit=200`);
    let data1 = await klines1.json();
    let closes1 = data1.map(c=>parseFloat(c[4]));
    let signal1 = checkCross(symbol, closes1, states1, times1);
    let time1 = times1[symbol] || "";

    rowsHTML1 += `<tr>
      <td>${symbol}</td>
      <td>${price}</td>
      <td class="${signal1.toLowerCase()}">${signal1}</td>
      <td>${time1}</td>
    </tr>`;

    if(signal1 && !document.hasFocus()) {
      let note = `<tr><td>${time1}</td><td>${symbol}</td><td class="${signal1.toLowerCase()}">${signal1}</td></tr>`;
      addNotification(note);
    }

    let price = parseFloat(priceJson.price);

    let klines2 = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf2}&limit=200`);
