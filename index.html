<!DOCTYPE html>
<html>
<head>
  <title>Trading Dashboard</title>
  <style>
    body { font-family: Arial; background:#0F0F0F; color:#fff; }
    #dashboard { width:100%; max-width:900px; margin:auto; }
    #panel { background:#1a1a1a; padding:15px; border-radius:8px; margin-top:20px; }
    .row { margin:10px 0; }
    button { padding:8px 12px; margin-right:10px; }
  </style>
</head>
<body>
<div id="dashboard">
  <!-- TradingView Chart (unchanged) -->
  <!-- TradingView Widget BEGIN -->
  <div class="tradingview-widget-container" style="height:500px;width:100%">
    <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
    <div class="tradingview-widget-copyright">
      <a href="https://www.tradingview.com/symbols/NASDAQ-AAPL/" target="_blank">
        <span class="blue-text">AAPL stock chart</span>
      </a><span class="trademark"> by TradingView</span>
    </div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
    {
      "symbol": "NASDAQ:AAPL",
      "interval": "D",
      "theme": "dark",
      "autosize": true,
      "backgroundColor": "#0F0F0F",
      "gridColor": "rgba(242, 242, 242, 0.2)"
    }
    </script>
  </div>
  <!-- TradingView Widget END -->

  <!-- Practice Trading Panel -->
  <div id="panel">
    <div class="row">
      Amount: <input id="amount" type="number" value="100">
    </div>
    <div class="row">
      Stop Loss: <input id="stop" type="number" value="330">
    </div>
    <div class="row">
      <button onclick="buy()">Buy</button>
      <button onclick="sell()">Sell</button>
    </div>
    <div class="row" id="status">No trade yet</div>
  </div>
</div>

<script>
let inTrade=false, entry=0, stop=0, isLong=false, amount=0;

function buy(){
  if(!inTrade){
    entry=337; // demo current price
    stop=parseFloat(document.getElementById('stop').value);
    amount=parseFloat(document.getElementById('amount').value);
    inTrade=true; isLong=true;
    updateStatus("BUY at "+entry+" | Stop "+stop+" | Amount "+amount);
  }
}
function sell(){
  if(!inTrade){
    entry=337; // demo current price
    stop=parseFloat(document.getElementById('stop').value);
    amount=parseFloat(document.getElementById('amount').value);
    inTrade=true; isLong=false;
    updateStatus("SELL at "+entry+" | Stop "+stop+" | Amount "+amount);
  }
}
function updateStatus(msg){
  document.getElementById('status').innerText=msg;
}
</script>
</body>
</html>
