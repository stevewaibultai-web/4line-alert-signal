<!DOCTYPE html>
<html>
<head>
  <title>Mini Chart + Practice Trading</title>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-mini-chart.js"></script>
  <style>
    body { font-family: Arial; background:#f4f4f4; }
    #dashboard { width:100%; max-width:600px; margin:auto; }
    #chart { margin-bottom:20px; }
    #panel { background:#fff; padding:15px; border-radius:8px; }
    .row { margin:10px 0; }
  </style>
</head>
<body>
<div id="dashboard">
  <!-- Chart (তোমার দেওয়া স্ক্রিপ্ট 그대로) -->
  <div id="chart">
    <tv-mini-chart symbol="NASDAQ:AAPL"></tv-mini-chart>
  </div>

  <!-- Practice Trading Panel -->
  <div id="panel">
    <div class="row">
      Amount: <input id="amount" type="number" value="100">
    </div>
    <div class="row">
      Stop Loss: <input id="stop" type="number" value="330">
    </div>
    <div class="row">
      <button onclick="buy()">Buy</button>
      <button onclick="sell()">Sell</button>
    </div>
    <div class="row" id="status">No trade yet</div>
  </div>
</div>

<script>
let inTrade=false, entry=0, stop=0, isLong=false, amount=0;

function buy(){
  if(!inTrade){
    entry=337; // demo: current price
    stop=parseFloat(document.getElementById('stop').value);
    amount=parseFloat(document.getElementById('amount').value);
    inTrade=true; isLong=true;
    updateStatus("Buy at "+entry+" Stop "+stop+" Amount "+amount);
  }
}
function sell(){
  if(!inTrade){
    entry=337;
    stop=parseFloat(document.getElementById('stop').value);
    amount=parseFloat(document.getElementById('amount').value);
    inTrade=true; isLong=false;
    updateStatus("Sell at "+entry+" Stop "+stop+" Amount "+amount);
  }
}
function updateStatus(msg){
  document.getElementById('status').innerText=msg;
}
</script>
</body>
</html>
