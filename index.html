<!DOCTYPE html>
<html>
<head>
  <title>Cross Dashboard</title>
  <style>
    body { font-family: Arial; background:#111; color:#eee; }
    table { width:100%; border-collapse: collapse; margin-bottom:20px; }
    th, td { border:1px solid #444; padding:8px; text-align:center; }
    #notifications { background:#222; padding:10px; min-height:100px; }
    .buy { color:lime; }
    .sell { color:red; }
    textarea { width:100%; height:80px; background:#222; color:#eee; }
    button { margin-top:10px; }
  </style>
</head>
<body>
  <h2>Cross Dashboard</h2>

  <!-- Timeframe Option -->
  <label for="timeframe">Timeframe:</label>
  <select id="timeframe" onchange="saveSettings()">
    <option value="1s">1s</option>
    <option value="5s">5s</option>
    <option value="30s">30s</option>
    <option value="180s">180s</option>
    <option value="900s">900s</option>
  </select>

  <!-- Symbol Editor -->
  <h3>Edit Symbols</h3>
  <textarea id="symbolsEditor"></textarea>
  <button onclick="saveSymbols()">Save Symbols</button>

  <table>
    <tr><th>Symbol</th><th>Price</th><th>Signal</th><th>Time</th></tr>
    <tbody id="rows"></tbody>
  </table>

  <h3>Notifications</h3>
  <div id="notifications"></div>
  <button onclick="clearNotifications()">Clear Notifications</button>

<script>
// Load settings
let symbols = JSON.parse(localStorage.getItem("symbols")) || ["BTCUSDT","ETHUSDT"];
document.getElementById("symbolsEditor").value = symbols.join(",");

let savedTF  = localStorage.getItem("timeframe") || "1s";
document.getElementById("timeframe").value = savedTF;

function saveSettings() {
  localStorage.setItem("timeframe", document.getElementById("timeframe").value);
}

function saveSymbols() {
  symbols = document.getElementById("symbolsEditor").value.split(",").map(s=>s.trim()).filter(s=>s);
  localStorage.setItem("symbols", JSON.stringify(symbols));
}

// State tracking
let states = {}; // {symbol: "Buy"/"Sell"}
let times  = {}; // {symbol: last signal time}

function sma(values, len) {
  return values.slice(-len).reduce((a,b)=>a+b,0)/len;
}

function checkCross(symbol, closes) {
  let ma30  = sma(closes, 30);
  let ma180 = sma(closes, 180);

  let prev = states[symbol] || "";
  let signal = prev;

  if(ma30 > ma180 && prev !== "Buy") {
    signal = "Buy";
    states[symbol] = "Buy";
    times[symbol] = new Date().toLocaleTimeString();
  }
  else if(ma30 < ma180 && prev !== "Sell") {
    signal = "Sell";
    states[symbol] = "Sell";
    times[symbol] = new Date().toLocaleTimeString();
  }
  return signal;
}

async function fetchData() {
  let timeframe = document.getElementById("timeframe").value;
  let rowsHTML = "";

  for (let symbol of symbols) {
    let priceData = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
    let priceJson = await priceData.json();
    let price = parseFloat(priceJson.price);

    let klines = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${timeframe}&limit=200`);
    let data = await klines.json();
    let closes = data.map(c=>parseFloat(c[4]));

    let signal = checkCross(symbol, closes);
    let time = times[symbol] || "";

    rowsHTML += `<tr>
      <td>${symbol}</td>
      <td>${price}</td>
      <td class="${signal.toLowerCase()}">${signal}</td>
      <td>${time}</td>
    </tr>`;

    if(signal && !document.hasFocus()) {
      let note = `${time} - ${symbol} - ${signal}`;
      addNotification(note);
    }
  }

  document.getElementById("rows").innerHTML = rowsHTML;
}

function addNotification(note) {
  let notes = JSON.parse(localStorage.getItem("notes")||"[]");
  notes.push(note);
  localStorage.setItem("notes", JSON.stringify(notes));
  renderNotifications();
}

function renderNotifications() {
  let notes = JSON.parse(localStorage.getItem("notes")||"[]");
  document.getElementById("notifications").innerHTML = notes.map(n=>"<p>"+n+"</p>").join("");
}

function clearNotifications() {
  localStorage.removeItem("notes");
  renderNotifications();
}

renderNotifications();
setInterval(fetchData, 5000);
</script>
</body>
</html>
