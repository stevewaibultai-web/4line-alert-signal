<!DOCTYPE html>
<html>
<head>
  <title>Trading Dashboard</title>
  <style>
    body { font-family: Arial; background:#0F0F0F; color:#fff; margin:0; padding:0; }
    #dashboard { width:100%; height:100vh; display:flex; flex-direction:column; }
    #chart { flex:3; }   /* চার্ট বেশি জায়গা নেবে */
    #panel { flex:1; background:#1a1a1a; padding:15px; border-top:2px solid #333; }
    .row { margin:8px 0; }
    button { padding:8px 12px; margin-right:10px; }
    input { width:100px; }
  </style>
</head>
<body>
<div id="dashboard">
  <!-- TradingView Chart (unchanged) -->
  <div id="chart">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {
        "symbol": "NASDAQ:AAPL",
        "interval": "D",
        "theme": "dark",
        "autosize": true,
        "backgroundColor": "#0F0F0F",
        "gridColor": "rgba(242, 242, 242, 0.2)"
      }
      </script>
    </div>
  </div>

  <!-- Practice Trading Panel -->
  <div id="panel">
    <div class="row">
      Amount: <input id="amount" type="number" value="100">
    </div>
    <div class="row">
      Stop Loss: <input id="stop" type="number" value="330">
    </div>
    <div class="row">
      <button onclick="buy()">Buy</button>
      <button onclick="sell()">Sell</button>
    </div>
    <div class="row" id="status">No trade yet</div>
  </div>
</div>

<script>
let inTrade=false, entry=0, stop=0, isLong=false, amount=0;

function buy(){
  if(!inTrade){
    entry=337; // demo current price
    stop=parseFloat(document.getElementById('stop').value);
    amount=parseFloat(document.getElementById('amount').value);
    inTrade=true; isLong=true;
    updateStatus("BUY at "+entry+" | Stop "+stop+" | Amount "+amount);
  }
}
function sell(){
  if(!inTrade){
    entry=337;
    stop=parseFloat(document.getElementById('stop').value);
    amount=parseFloat(document.getElementById('amount').value);
    inTrade=true; isLong=false;
    updateStatus("SELL at "+entry+" | Stop "+stop+" | Amount "+amount);
  }
}
function updateStatus(msg){
  document.getElementById('status').innerText=msg;
}
</script>
</body>
</html>
