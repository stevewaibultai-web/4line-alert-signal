<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crypto & Stock Dashboard</title>
    <!-- Load the script in the head -->
    <script type="module" src="https://tradingview-widget.com"></script>
    <style>
        body {
            background-color: #0d1117;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
        }
        .dashboard-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .chart-box {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            height: 220px;
            background: #161b22;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Chart 1: Apple -->
        <div class="chart-box">
            <tv-mini-chart symbol="NASDAQ:AAPL" theme="dark" width="100%" height="100%"></tv-mini-chart>
        </div>

        <!-- Chart 2: Microsoft -->
        <div class="chart-box">
            <tv-mini-chart symbol="NASDAQ:MSFT" theme="dark" width="100%" height="100%"></tv-mini-chart>
        </div>

        <!-- Chart 3: Google -->
        <div class="chart-box">
            <tv-mini-chart symbol="NASDAQ:GOOGL" theme="dark" width="100%" height="100%"></tv-mini-chart>
        </div>

    </div>

</body>
</html>
